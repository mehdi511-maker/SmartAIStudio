
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android \
              --org ir.smartai \
              --project-name smart_ai_studio .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
