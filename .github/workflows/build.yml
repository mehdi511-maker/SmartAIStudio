
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o SmartAIStudio_GitHub.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project extracted successfully"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --org ir.smartai \
            --project-name smart_ai_studio .

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      # Set the main Android app to API 36
      - name: Configure app compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]

          for f in files:
              if not f.exists():
                  continue

              s = f.read_text()

              s = re.sub(
                  r'(?m)^(\s*compileSdkVersion\s+).+$',
                  r'\g<1>36',
                  s
              )

              s = re.sub(
                  r'(?m)^(\s*compileSdk\s*=\s*).+$',
                  r'\g<1>36',
                  s
              )

              s = re.sub(
                  r'(?m)^(\s*compileSdk\s+).+$',
                  r'\g<1>36',
                  s
              )

              f.write_text(s)
              print("Updated app:", f)

          PY

      # Fix file_picker Android library itself
      - name: Fix file_picker compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          matches = list(cache.glob("file_picker-*/android/build.gradle"))
          matches += list(cache.glob("file_picker-*/android/build.gradle.kts"))

          if not matches:
              raise SystemExit("ERROR: file_picker Gradle file not found")

          for f in matches:
              s = f.read_text()

              # Groovy: compileSdk flutter.compileSdkVersion
              # Kotlin: compileSdk = flutter.compileSdkVersion
              s = re.sub(
                  r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?).+$',
                  lambda m: m.group(1) + "36",
                  s
              )

              f.write_text(s)

              print("Updated:", f)
              for line in s.splitlines():
                  if "compileSdk" in line:
                      print("   ", line.strip())

          PY

      # Verify that file_picker is no longer using API 34
      - name: Verify compile SDK
        run: |
          echo "---- APP ----"
          grep -nE 'compileSdk|compileSdkVersion' android/app/build.gradle* || true

          echo "---- FILE PICKER ----"
          grep -nE 'compileSdk|compileSdkVersion' \
            "$HOME"/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle* || true

          if grep -RniE 'compileSdk.*34|compileSdkVersion 34' \
            "$HOME"/.pub-cache/hosted/pub.dev/file_picker-*/android/; then
            echo "ERROR: file_picker still uses API 34"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
