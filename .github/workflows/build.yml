
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout
        uses: actions/checkout@v4

      # 2. استخراج سورس اصلی
      - name: Extract project ZIP
        run: |
          unzip -o SmartAIStudio_GitHub.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart

      # 3. نصب Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. نصب Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. ایجاد پروژه Android جدید
      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --org ir.smartai \
            --project-name smart_ai_studio .

      # 6. حذف تست پیش‌فرض
      - name: Remove default test
        run: rm -f test/widget_test.dart

      # 7. دریافت وابستگی‌ها
      - name: Get dependencies
        run: flutter pub get

      # 8. تنظیم صحیح compileSdk برای هر دو قالب Gradle
      - name: Configure Android SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def set_compile_sdk(file_path):
              path = Path(file_path)

              if not path.exists():
                  return False

              content = path.read_text()
              indent = "    "

              if path.name.endswith(".gradle.kts"):
                  pattern = r'(?m)^(\s*)compileSdk\s*(?:=.*)?$'
                  replacement = r'\g<1>compileSdk = 36'
              else:
                  pattern = r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=.*)?$'
                  replacement = r'\g<1>compileSdkVersion 36'

              updated, count = re.subn(
                  pattern,
                  replacement,
                  content
              )

              if count == 0:
                  raise RuntimeError(
                      f"compileSdk declaration not found in {path}"
                  )

              path.write_text(updated)
              print(f"Updated: {path}")
              return True

          # برنامه اصلی
          app_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_found = False

          for file_path in app_files:
              if file_path.exists():
                  set_compile_sdk(file_path)
                  app_found = True
                  break

          if not app_found:
              raise RuntimeError("Android app Gradle file not found")

          # افزونه‌های وابسته
          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          packages = [
              "file_picker",
              "flutter_plugin_android_lifecycle"
          ]

          for package in packages:
              gradle_files = []

              gradle_files.extend(
                  cache.glob(package + "-*/android/build.gradle")
              )

              gradle_files.extend(
                  cache.glob(package + "-*/android/build.gradle.kts")
              )

              if not gradle_files:
                  raise RuntimeError(
                      f"Gradle file not found for {package}"
                  )

              for gradle_file in gradle_files:
                  set_compile_sdk(gradle_file)

          print("All compileSdk configurations updated.")
          PY

      # 9. کنترل نهایی تنظیمات
      - name: Verify SDK configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_file = next((p for p in files if p.exists()), None)

          if app_file is None:
              raise SystemExit("App Gradle file missing")

          app_text = app_file.read_text()

          if not re.search(
              r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$',
              app_text
          ):
              raise SystemExit("App compileSdk is not 36")

          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          for package in [
              "file_picker",
              "flutter_plugin_android_lifecycle"
          ]:
              candidates = list(
                  cache.glob(package + "-*/android/build.gradle")
              )
              candidates += list(
                  cache.glob(package + "-*/android/build.gradle.kts")
              )

              for file in candidates:
                  content = file.read_text()

                  if not re.search(
                      r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$',
                      content
                  ):
                      raise SystemExit(
                          f"compileSdk 36 verification failed: {file}"
                      )

                  print(f"Verified: {file}")

          print("SDK 36 verification successful.")
          PY

      # 10. بررسی کد
      - name: Analyze Flutter project
        run: flutter analyze

      # 11. ساخت APK
      - name: Build release APK
        run: flutter build apk --release

      # 12. ذخیره APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
