
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout
        uses: actions/checkout@v4

      # 2. استخراج پروژه
      - name: Extract project ZIP
        run: |
          unzip -o SmartAIStudio_GitHub.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project extracted successfully"

      # 3. نصب Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. نصب Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. ساخت پوشه Android جدید
      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --org ir.smartai \
            --project-name smart_ai_studio .

      # 6. حذف تست پیش‌فرض Flutter
      - name: Remove default test
        run: rm -f test/widget_test.dart

      # 7. دریافت کتابخانه‌ها
      - name: Get dependencies
        run: flutter pub get

      # 8. اصلاح compileSdk برنامه و افزونه‌ها
      - name: Fix Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # تنظیم برنامه اصلی
          for f in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ]:
              if f.exists():
                  s = f.read_text()
                  s = re.sub(
                      r'(?m)^(\s*compileSdkVersion\s+).+$',
                      r'\g<1>36',
                      s
                  )
                  s = re.sub(
                      r'(?m)^(\s*compileSdk\s*=\s*).+$',
                      r'\g<1>36',
                      s
                  )
                  f.write_text(s)
                  print("Updated app:", f)

          # تنظیم افزونه‌های نیازمند API 36
          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          packages = [
              "file_picker",
              "flutter_plugin_android_lifecycle"
          ]

          for package in packages:
              for f in cache.glob(package + "-*/android/build.gradle*"):
                  s = f.read_text()

                  s = re.sub(
                      r'(?m)^(\s*compileSdkVersion\s+).+$',
                      r'\g<1>36',
                      s
                  )

                  s = re.sub(
                      r'(?m)^(\s*compileSdk\s*=\s*).+$',
                      r'\g<1>36',
                      s
                  )

                  f.write_text(s)
                  print("Updated plugin:", f)
          PY

      # 9. بررسی تنظیمات SDK
      - name: Verify SDK configuration
        run: |
          grep -RniE 'compileSdk|compileSdkVersion' android
          grep -RniE 'compileSdk|compileSdkVersion' \
            "$HOME/.pub-cache/hosted/pub.dev/file_picker-"*"/android" \
            "$HOME/.pub-cache/hosted/pub.dev/flutter_plugin_android_lifecycle-"*"/android" || true

      # 10. بررسی کد
      - name: Analyze
        run: flutter analyze

      # 11. ساخت APK
      - name: Build release APK
        run: flutter build apk --release

      # 12. دریافت خروجی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
