
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extract the actual Flutter source from the uploaded ZIP
      - name: Extract project ZIP
        run: |
          unzip -o SmartAIStudio_GitHub.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Project source extracted successfully"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --org ir.smartai \
            --project-name smart_ai_studio .
            
      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart


      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
