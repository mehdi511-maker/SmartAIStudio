
name: Build Smart AI Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o SmartAIStudio_GitHub.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android \
            --org ir.smartai \
            --project-name smart_ai_studio .

      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def set_compile_sdk(file_path):
              path = Path(file_path)

              if not path.exists():
                  return False

              content = path.read_text()

              if path.name.endswith(".gradle.kts"):
                  pattern = r'(?m)^(\s*)compileSdk\b.*$'
                  replacement = r'\g<1>compileSdk = 36'
              else:
                  pattern = r'(?m)^(\s*)compileSdk(?:Version)?\b.*$'
                  replacement = r'\g<1>compileSdkVersion 36'

              updated, count = re.subn(
                  pattern,
                  replacement,
                  content
              )

              if count == 0:
                  raise RuntimeError(
                      f"compileSdk declaration not found in {path}"
                  )

              path.write_text(updated)
              print(f"Updated: {path}")
              return True

          # Configure Android application
          app_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_found = False

          for file_path in app_files:
              if file_path.exists():
                  set_compile_sdk(file_path)
                  app_found = True
                  break

          if not app_found:
              raise RuntimeError("Android app Gradle file not found")

          # Configure Android plugins
          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          packages = [
              "file_picker",
              "flutter_plugin_android_lifecycle"
          ]

          for package in packages:
              gradle_files = []

              gradle_files.extend(
                  cache.glob(package + "-*/android/build.gradle")
              )

              gradle_files.extend(
                  cache.glob(package + "-*/android/build.gradle.kts")
              )

              if not gradle_files:
                  raise RuntimeError(
                      f"Gradle file not found for {package}"
                  )

              for gradle_file in gradle_files:
                  set_compile_sdk(gradle_file)

          print("All compileSdk configurations updated.")
          PY

      - name: Verify SDK configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def verify(file_path):
              path = Path(file_path)

              if not path.exists():
                  raise RuntimeError(f"File missing: {path}")

              content = path.read_text()

              if path.name.endswith(".gradle.kts"):
                  pattern = r'(?m)^\s*compileSdk\s*=\s*36\s*$'
              else:
                  pattern = r'(?m)^\s*compileSdkVersion\s+36\s*$'

              if not re.search(pattern, content):
                  raise RuntimeError(
                      f"compileSdk 36 verification failed: {path}"
                  )

              print(f"Verified: {path}")

          # Verify application
          app_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          app_file = next(
              (p for p in app_files if p.exists()),
              None
          )

          if app_file is None:
              raise RuntimeError("App Gradle file missing")

          verify(app_file)

          # Verify plugins
          cache = Path.home() / ".pub-cache/hosted/pub.dev"

          for package in [
              "file_picker",
              "flutter_plugin_android_lifecycle"
          ]:
              candidates = []

              candidates.extend(
                  cache.glob(package + "-*/android/build.gradle")
              )

              candidates.extend(
                  cache.glob(package + "-*/android/build.gradle.kts")
              )

              if not candidates:
                  raise RuntimeError(
                      f"Plugin Gradle file missing: {package}"
                  )

              for candidate in candidates:
                  verify(candidate)

          print("SDK 36 verification successful.")
          PY

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
